name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "$files"; echo "gofmt: files need formatting"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # An older staticcheck could not read a new Go version's export data: its "internal error
      # in importing" is the tool failing, not a finding, and it must not stop
      # the race tests and govulncheck. A real finding still fails the job.
      - name: staticcheck (skipped when it cannot read this Go version's export data)
        run: |
          set +e
          out=$(go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... 2>&1); st=$?
          set -e
          if printf '%s\n' "$out" | grep -q "internal error in importing"; then
            echo "staticcheck skipped: it cannot read $(go env GOVERSION) export data"
          elif [ "$st" -ne 0 ]; then printf '%s\n' "$out"; exit "$st"
          else echo "staticcheck: ok"; fi
      - name: go test -race
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
